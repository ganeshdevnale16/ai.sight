services:
  - type: web
    name: insightdesk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # single worker: background jobs live in this process
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: EPHEMERAL_STORAGE        # free plan: files are cleared when the app restarts or sleeps
        value: "true"
      - key: MAX_UPLOAD_MB            # free plan has 512 MB RAM — keep uploads modest
        value: "40"
      - key: APP_SECRET_KEY
        generateValue: true
      - key: APP_PASSWORD             # login password — set in the Render dashboard
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY        # Claude key — set in the Render dashboard
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: AZURE_OPENAI_API_KEY     # Azure OpenAI key — set in the Render dashboard
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        value: https://dmd-open-ai.openai.azure.com/
      - key: AZURE_OPENAI_DEPLOYMENT
        value: gpt-4o
      - key: AZURE_OPENAI_API_VERSION
        value: 2025-03-01-preview
